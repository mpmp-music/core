<svg xmlns="http://www.w3.org/2000/svg" width="920" height="724" viewBox="0 0 920 724" role="img" aria-labelledby="title desc">
<title id="title">mpmp core architecture</title>
<desc id="desc">Five layers of crates. A host application uses mpmp-core through CoreHandle; player-mcp reaches mpmp-core through mpmp-agent-mcp. mpmp-core uses mpmp-library and mpmp-engine; mpmp-library uses mpmp-engine, mpmp-storage and mpmp-media-io; mpmp-engine uses mpmp-media-io. Between the domain and foundation layers, the platform adapters mpmp-fs-desktop and mpmp-output-cpal implement the storage traits and the engine's OutputBackend.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328}
.band{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1}
.layer{font-size:14px;font-weight:600;letter-spacing:.2px}
.sub{font-size:12px;fill:#59636e}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.card.accent{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}
.name{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:14.5px;font-weight:600;text-anchor:middle}
.name.accent{fill:#0550ae}
.role{font-size:12.5px;fill:#59636e;text-anchor:middle}
.host{fill:none;stroke:#0969da;stroke-width:1.75}
.dep{fill:none;stroke:#6e7781;stroke-width:1.5}
.impl{fill:none;stroke:#6e7781;stroke-width:1.5;stroke-dasharray:5 4}
.label{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;fill:#59636e}
.label.accent{fill:#0550ae}
.pill{fill:#ffffff;stroke:#0969da;stroke-width:1.5}
.pilltext{font-size:14px;font-weight:600;text-anchor:middle}
.legend{font-size:12px;fill:#59636e}
</style>
