<marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#0969da"/></marker>
</defs>
<rect class="band" x="20" y="88" width="880" height="92" rx="14"/>
<text class="layer" x="40" y="139.0">Access</text>
<rect class="band" x="20" y="208" width="880" height="92" rx="14"/>
<text class="layer" x="40" y="259.0">Service</text>
<rect class="band" x="20" y="328" width="880" height="92" rx="14"/>
<text class="layer" x="40" y="379.0">Domain</text>
<rect class="band" x="20" y="448" width="880" height="92" rx="14"/>
<text class="layer" x="40" y="491.0">Platform adapters</text>
<text class="sub" x="40" y="509.0">pluggable</text>
<rect class="band" x="20" y="568" width="880" height="92" rx="14"/>
<text class="layer" x="40" y="619.0">Foundation</text>
<rect class="pill" x="190.5" y="20" width="192" height="40" rx="20"/>
<text class="pilltext" x="286.5" y="45">Host application</text>
<rect class="card" x="423" y="102" width="214" height="64" rx="10"/><text class="name" x="530.0" y="130">player-mcp</text><text class="role" x="530.0" y="150">stdio bridge</text>
<rect class="card" x="667" y="102" width="213" height="64" rx="10"/><text class="name" x="773.5" y="130">mpmp-agent-mcp</text><text class="role" x="773.5" y="150">MCP service</text>
<rect class="card accent" x="180" y="222" width="700" height="64" rx="10"/><text class="name accent" x="530.0" y="250">mpmp-core</text><text class="role" x="530.0" y="270">actor · contract · permissions</text>
<rect class="card" x="180" y="342" width="430" height="64" rx="10"/><text class="name" x="395.0" y="370">mpmp-library</text><text class="role" x="395.0" y="390">catalog · scans · file edits</text>
<rect class="card" x="640" y="342" width="240" height="64" rx="10"/><text class="name" x="760.0" y="370">mpmp-engine</text><text class="role" x="760.0" y="390">decoding · gapless playback</text>
<rect class="card" x="180" y="462" width="180" height="64" rx="10"/><text class="name" x="270.0" y="490">mpmp-fs-desktop</text><text class="role" x="270.0" y="510">desktop file system</text>
<rect class="card" x="700" y="462" width="180" height="64" rx="10"/><text class="name" x="790.0" y="490">mpmp-output-cpal</text><text class="role" x="790.0" y="510">audio output</text>
<rect class="card" x="180" y="582" width="340" height="64" rx="10"/><text class="name" x="350.0" y="610">mpmp-storage</text><text class="role" x="350.0" y="630">storage traits</text>
