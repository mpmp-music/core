<path class="dep" d="M760.0 286 L760.0 340" marker-end="url(#head)"/>
<path class="dep" d="M610 374.0 L638 374.0" marker-end="url(#head)"/>
<path class="dep" d="M440 406 L440 580" marker-end="url(#head)"/>
<path class="dep" d="M585 406 L585 580" marker-end="url(#head)"/>
<path class="dep" d="M668 406 L668 580" marker-end="url(#head)"/>
<path class="impl" d="M790.0 462 L790.0 408" marker-end="url(#head)"/>
<path class="impl" d="M270.0 526 L270.0 580" marker-end="url(#head)"/>
<text class="label" x="802.0" y="438.0">OutputBackend</text>
<text class="label" x="282.0" y="558.0">desktop-fs</text>
<path class="dep" d="M180 698 L214 698" marker-end="url(#head)"/>
<text class="legend" x="224" y="702">depends on</text>
<path class="impl" d="M330 698 L364 698" marker-end="url(#head)"/>
<text class="legend" x="374" y="702">implements a trait of</text>
</svg>
