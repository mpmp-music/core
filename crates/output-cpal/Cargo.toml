[package]
name = "mpmp-output-cpal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mpmp-engine.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "=0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFString"] }
