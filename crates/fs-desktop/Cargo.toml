[package]
name = "mpmp-fs-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The desktop's file system rules: what differs between Unix and Windows, for the library
# (its folders and files) and for core (location strings, contract guarantee 16).
[dependencies]
mpmp-storage.workspace = true
tempfile.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(unix))'.dependencies]
same-file.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
