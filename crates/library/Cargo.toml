[package]
name = "mpmp-library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["desktop-fs"]
desktop-fs = ["dep:mpmp-fs-desktop"]

[dependencies]
mpmp-storage.workspace = true
tempfile.workspace = true
mpmp-media-io.workspace = true
mpmp-engine.workspace = true
lofty.workspace = true
rusqlite.workspace = true
chardetng.workspace = true
encoding_rs.workspace = true
unicode-normalization.workspace = true
walkdir.workspace = true
image.workspace = true
sha2.workspace = true
getrandom.workspace = true
mpmp-fs-desktop = { workspace = true, optional = true }
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
mpmp-test-support.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true

[[test]]
name = "scan"
required-features = ["desktop-fs"]

[[test]]
name = "tag_edit"
path = "tests/tag_edit/main.rs"
required-features = ["desktop-fs"]
