[package]
name = "mpmp-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "player-mcp"
path = "src/main.rs"

[dependencies]
# Only the endpoint and the handshake: the bridge forwards MCP unread, never links core or
# the library.
mpmp-agent-mcp = { workspace = true, features = ["desktop-endpoint"] }
# When it cannot reach the player, the bridge is a small MCP server of its own that tells
# the model why (one tool, `player_mcp_status`): rmcp's server, as the adapter uses it.
rmcp = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "io-std", "time", "macros", "sync"] }
serde_json.workspace = true

[dev-dependencies]
mpmp-agent-mcp = { workspace = true, features = ["server"] }
mpmp-core = { workspace = true, features = ["desktop-fs"] }
mpmp-engine.workspace = true
mpmp-media-io.workspace = true
mpmp-library = { workspace = true, features = ["desktop-fs"] }
rmcp = { workspace = true, features = ["client", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync"] }
hound.workspace = true
tempfile.workspace = true
